<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing | Felix Ogon</title>
    <link rel="stylesheet" href="style.css?v=theme-fix-20260819">
    <style>
        .activity-card { margin-bottom: 40px; padding: 20px; border-left: 1px solid var(--text-color); }
        .activity-title a { color: inherit; text-decoration: none; font-weight: bold; font-size: 1.3rem; text-transform: uppercase; }
        .activity-title a:hover { text-decoration: underline; }
        .activity-org { font-style: italic; opacity: 0.8; margin-bottom: 10px; font-size: 0.9rem; }
        .activity-card ul { padding-left: 15px; margin-top: 10px; }
        .activity-card li { margin-bottom: 8px; line-height: 1.5; font-size: 0.95rem; }
    </style>
</head>
<body>
    <script>document.documentElement.classList.add('theme-preload'); if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');</script>

    <button id="theme-btn" class="toggle-btn" onclick="toggleTheme()">Switch to Dark</button>
    
    <nav style="text-align: left; padding: 20px;"><a href="index.html">← Back</a></nav>
    
    <div class="content">
        <h1 class="page-title">Writing</h1>
        
        <div class="activity-card"><div class="activity-title"><a href="papers/semg_smart_wearables_review.pdf" target="_blank">sEMG Signal Processing for Real-Time Gesture Recognition in Wearables</a></div>
            <div class="activity-org">Fun literature review I wrote with the supervision of Prof. Dr. Robert Riener and Dr. Diego Paez-Granados at the Spinal Cord Injury &amp; Artificial Intelligence (SCAI) Lab</div>
        </div>
    </div>

    <script src="script.js?v=theme-fix-20260819"></script>
    <script>if (document.body.classList.contains('dark-mode')) document.getElementById('theme-btn').innerHTML = "Switch to Light";</script>
</body>
</html>
